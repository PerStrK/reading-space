<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生词本 · 阅读空间</title>
<meta name="description" content="阅读空间：我的生词本——划词时收下的单词，带音标、中文翻译和原文例句。">
<link rel="stylesheet" href="assets/site.css?v=20261031">
<script src="/assets/account.js?v=20261104" defer></script>
<style>
.top{padding:20px 0 6px}
.top .wrap{display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; min-width:0}
.brand .mark{width:34px; height:34px; flex:0 0 auto; border-radius:11px; background:#c2352b; color:#fff;
  display:grid; place-items:center; font-family:Georgia,"Songti SC",serif; font-size:19px}
.brand b{font-family:Georgia,"Songti SC",serif; font-size:18px; letter-spacing:.06em; white-space:nowrap}
.brand .tag{font-size:11.5px; color:var(--muted); letter-spacing:.2em; white-space:nowrap}
[hidden]{display:none !important}
.acct{margin-left:auto; font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:999px;
  background:#e7f2ec; color:#0f6e56; border:1px solid #bfe0d0; white-space:nowrap}
.out{margin-left:12px; font-size:12.5px; color:var(--muted); text-decoration:none;
  border-bottom:1px solid #d9cfbd; padding-bottom:1px; white-space:nowrap}
.out:hover{color:#c2352b; border-color:#c2352b}
@media (max-width:560px){ .brand .tag{display:none} }

.vhead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:24px}
.vhead h1{font-family:Georgia,"Songti SC",serif; font-size:22px; margin:0}
.vhead .cnt{color:var(--muted); font-size:13.5px}
.vhead .exp{margin-left:auto; font-size:13px; color:var(--teal); text-decoration:none; border-bottom:1px solid #bcd8d8; padding-bottom:1px}
.vhead .exp:hover{color:#c2352b; border-color:#c2352b}

.addbar{display:flex; align-items:center; gap:9px; margin-top:18px; flex-wrap:wrap}
.addbar input{font:inherit; font-size:14.5px; padding:9px 13px; border:1px solid var(--line); border-radius:10px;
  background:#fffdf9; color:var(--ink); flex:1 1 220px; min-width:0}
.addbar input:focus{outline:2px solid #bcd8d8; border-color:var(--teal)}
.addbar button{font:inherit; font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:10px; cursor:pointer;
  border:1px solid var(--teal); background:var(--teal); color:#fff}
.addbar button:disabled{opacity:.55; cursor:default}
.addbar .addmsg{font-size:13px; color:var(--muted)}

.users{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.users .ulab{font-size:12.5px; color:var(--muted); align-self:center}
.users button{font:inherit; font-size:13px; padding:6px 14px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:#fffdf9; color:var(--ink)}
.users button.on{background:var(--ink); color:#fff; border-color:var(--ink)}

.vlist{margin-top:18px; display:flex; flex-direction:column; gap:12px}
.vw{background:#fffdf9; border:1px solid var(--line); border-radius:14px; padding:15px 18px 13px; box-shadow:var(--shadow)}
.vw-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.vw .w{font-family:Georgia,serif; font-size:19px; font-weight:700; color:var(--ink); word-break:break-word}
.vw .ipa{font-size:14px; color:var(--teal)}
.vw .ops{margin-left:auto; display:flex; gap:7px; flex:0 0 auto}
.vw .del{font:inherit; font-size:12px; padding:4px 11px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--muted)}
.vw .mst{font:inherit; font-size:12px; padding:4px 11px; border-radius:8px; cursor:pointer;
  border:1px solid #bcd8d8; background:#fff; color:var(--teal)}
.vw .mst:hover{border-color:var(--teal)}
.vw.done{background:#f3f6f0}
.sechead{font-family:Georgia,"Songti SC",serif; font-size:17px; margin:22px 0 2px; display:flex; align-items:baseline; gap:10px}
.sechead .cnt2{font-size:12.5px; color:var(--muted); font-family:inherit}
.alldone{color:var(--muted); font-size:13.5px; padding:8px 2px}
.vw .del:hover{border-color:#c2352b; color:#c2352b}
.vw .del.armed{background:#c2352b; border-color:#c2352b; color:#fff}
.vw .tr{margin-top:6px; font-size:14.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word}
.vw .tr.empty{color:var(--muted); font-size:13px}
.vw .sent{margin:9px 0 0; font-size:13.5px; line-height:1.6; color:#4c463c; background:#f7f1e3;
  border-left:3px solid #d9c58f; border-radius:0 8px 8px 0; padding:8px 12px}
.vw .sent b{color:var(--gold); font-weight:600; margin-right:4px}
.vw .ctx{margin-top:2px}
.vw .sent .from{color:var(--muted); font-size:12.5px; white-space:nowrap}
.vw .auds{margin-left:8px; white-space:nowrap}
.vw .aud{border:1px solid #d9c58f; background:#fffdf6; color:#7a6420; border-radius:999px;
  font-size:12px; padding:2px 9px; margin-right:5px; cursor:pointer}
.vw .aud:active{transform:scale(.96)}
.vw .note{margin-top:7px; font-size:13px; color:var(--muted)}
.vw .meta{margin-top:9px; font-size:12px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap}
.empty{margin-top:30px; text-align:center; color:var(--muted); font-size:14.5px; line-height:2;
  border:1.5px dashed #cfc2a6; border-radius:16px; background:#fffdf9; padding:34px 20px}
.loading{margin-top:30px; text-align:center; color:var(--muted); font-size:14px}
</style>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <meta name="apple-mobile-web-app-title" content="阅读空间" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark">阅</span><b>阅读空间</b><span class="tag">生 词 · 本</span>
    </a>
    <span class="acct" id="acct" hidden></span>
    <a class="out" href="/logout">退出</a>
  </div>
</header>

<main class="wrap">
  <div class="vhead">
    <h1 id="whos">生词本</h1>
    <span class="cnt" id="cnt"></span>
    <a class="exp" id="expMd" href="/api/vocab/export?format=md" hidden>导出 Markdown</a>
  </div>
  <div class="users" id="users" hidden></div>
  <div class="addbar" id="addbar" hidden>
    <input id="addInput" type="text" placeholder="输入一个英文单词，直接添加到生词本" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button id="addBtn">＋ 添加生词</button>
    <span class="addmsg" id="addMsg"></span>
  </div>
  <div class="vlist" id="vlist"><div class="loading">正在打开生词本…</div></div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let me = null, viewUser = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
async function api(path, opt) {
  const r = await fetch(path, Object.assign({ credentials: "same-origin" }, opt || {}));
  return r.json();
}
function fmtDay(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
// 译文正文里若自带一行独立音标就去掉（页面已在词旁单独显示），其余原样保留
function trBody(it) {
  const t = String(it.translation || "").trim();
  if (!t) return "";
  const lines = t.split(/\n+/).map((x) => x.trim()).filter(Boolean);
  const out = lines.filter((ln) => !/^\/[^/]{1,40}\/$/.test(ln));
  return out.join("\n");
}

async function init() {
  try { me = await api("/api/me"); } catch (e) { me = null; }
  if (!me || !me.user) { $("vlist").innerHTML = '<div class="empty">没能确认登录状态，请刷新重试。</div>'; return; }
  viewUser = me.user;
  if (me.role === "admin") {
    try {
      const j = await api("/api/vocab/users");
      const users = (j && j.users) || [];
      if (!users.some((u) => u.user === me.user)) users.unshift({ user: me.user, n: 0 });
      if (users.length > 1) renderUsers(users);
    } catch (e) {}
  }
  load();
}

function renderUsers(users) {
  const box = $("users");
  box.innerHTML = "";
  const lab = document.createElement("span");
  lab.className = "ulab"; lab.textContent = "看谁的生词本：";
  box.appendChild(lab);
  users.forEach((u) => {
    const b = document.createElement("button");
    b.textContent = u.user + "（" + u.n + "）";
    if (u.user === viewUser) b.className = "on";
    b.onclick = () => {
      viewUser = u.user;
      box.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      load();
    };
    box.appendChild(b);
  });
  box.hidden = false;
}

async function load() {
  const own = viewUser === me.user;
  $("whos").textContent = own ? "我的生词本" : "「" + viewUser + "」的生词本";
  $("expMd").hidden = !own;
  $("addbar").hidden = !own;
  $("vlist").innerHTML = '<div class="loading">正在打开生词本…</div>';
  const q = own ? "" : "?user=" + encodeURIComponent(viewUser);
  let j;
  try { j = await api("/api/vocab" + q); } catch (e) { j = null; }
  const items = (j && j.items) || [];
  const review = items.filter((it) => !it.mastered);
  const done = items.filter((it) => !!it.mastered);
  $("cnt").textContent = items.length
    ? "共 " + items.length + " 个 · 需复习 " + review.length + " · 已掌握 " + done.length + " · 新收的在最前" : "";
  if (!items.length) {
    $("vlist").innerHTML = '<div class="empty">' +
      (own ? "还没有生词。<br>可以用上面的输入框直接添加，或在书里划中一个词，点「翻译」或「存生词」收进来。"
           : "这个账号还没有收过生词。") + "</div>";
    return;
  }
  const ctxBlock = (c) => {
    const aud = (c.audio_uk || c.audio_us)
      ? '<span class="auds">' +
        (c.audio_uk ? '<button class="aud" data-h="' + esc(c.h) + '" data-a="uk">🔊 英读</button>' : "") +
        (c.audio_us ? '<button class="aud" data-h="' + esc(c.h) + '" data-a="us">🔊 美读</button>' : "") +
        "</span>"
      : "";
    return '<div class="ctx">' +
      '<p class="sent"><b>原句</b>' + esc(c.sentence) + aud +
      (c.book_title ? '<span class="from">——《' + esc(c.book_title) + "》</span>" : "") + "</p>" +
      (c.sentence_zh ? '<p class="sent"><b>原句翻译</b>' + esc(c.sentence_zh) + "</p>" : "") +
      "</div>";
  };
  const senseBlock = (s) => {
    const head = ((s.pos ? s.pos + " " : "") + (s.zh || "")).trim();
    if (!s.ex_en) return head ? '<p class="sent">' + esc(head) + "</p>" : "";
    const aud = (s.audio_uk || s.audio_us)
      ? '<span class="auds">' +
        (s.audio_uk ? '<button class="aud" data-h="' + esc(s.ex_h) + '" data-a="uk">🔊 英读</button>' : "") +
        (s.audio_us ? '<button class="aud" data-h="' + esc(s.ex_h) + '" data-a="us">🔊 美读</button>' : "") +
        "</span>"
      : "";
    return '<p class="sent">' + esc(head) + "</p>" +
      '<p class="sent"><b>例句</b>' + esc(s.ex_en) + aud + "</p>" +
      (s.ex_zh ? '<p class="sent"><b>例句翻译</b>' + esc(s.ex_zh) + "</p>" : "");
  };
  const card = (it) => {
    const hasSenseEx = (it.senses || []).some((s) => s.ex_en);
    const body = (it.senses && it.senses.length)
      ? it.senses.map((s) => ((s.pos ? s.pos + " " : "") + (s.zh || "")).trim()).filter(Boolean).join("\n")
      : trBody(it);
    const mst = it.mastered
      ? '<button class="mst" data-w="' + esc(it.word) + '" data-b="' + esc(it.book) + '" data-m="0">↩ 搬回需复习</button>'
      : '<button class="mst" data-w="' + esc(it.word) + '" data-b="' + esc(it.book) + '" data-m="1">✓ 标记已掌握</button>';
    const ipas = (it.uk_ipa || it.us_ipa)
      ? '<span class="ipa">' +
        (it.uk_ipa ? "英 " + esc(it.uk_ipa) : "") +
        (it.uk_ipa && it.us_ipa ? " · " : "") +
        (it.us_ipa ? "美 " + esc(it.us_ipa) : "") + "</span>"
      : (it.ipa ? '<span class="ipa">' + esc(it.ipa) + "</span>" : "");
    const ctxs = (it.contexts || []).map(ctxBlock).join("");
    const waud = (it.word_audio_uk || it.word_audio_us)
      ? '<span class="auds">' +
        (it.word_audio_uk ? '<button class="aud waud" data-w="' + esc(it.word) + '" data-a="uk">🔊 英读</button>' : "") +
        (it.word_audio_us ? '<button class="aud waud" data-w="' + esc(it.word) + '" data-a="us">🔊 美读</button>' : "") +
        "</span>"
      : "";
    return '<article class="vw' + (it.mastered ? " done" : "") + '">' +
      '<div class="vw-head"><span class="w">' + esc(it.word) + "</span>" +
      ipas + waud +
      (own ? '<span class="ops">' + mst +
             '<button class="del" data-w="' + esc(it.word) + '" data-b="' + esc(it.book) + '">删除</button></span>' : "") +
      "</div>" +
      ((it.senses && it.senses.length)
        ? '<div class="senses">' + it.senses.map(senseBlock).join("") + "</div>"
        : (body ? '<div class="tr">' + esc(body) + "</div>"
            : '<div class="tr empty">（暂无译文，后台会自动补上，稍等几分钟再刷新看看）</div>')) +
      (ctxs || (it.sentence ? '<p class="sent"><b>原句</b>' + esc(it.sentence) + "</p>" : "") +
      (it.sentence_zh ? '<p class="sent"><b>原句翻译</b>' + esc(it.sentence_zh) + "</p>" : "")) +
      (!hasSenseEx && it.example ? '<p class="sent"><b>例句</b>' + esc(it.example) + "</p>" : "") +
      (!hasSenseEx && it.example_zh ? '<p class="sent"><b>例句翻译</b>' + esc(it.example_zh) + "</p>" : "") +
      (it.note ? '<div class="note">备注：' + esc(it.note) + "</div>" : "") +
      '<div class="meta"><span>' + (it.book === "manual" ? "✍ 手动添加" : "📖 " + esc(it.book_title || it.book)) + "</span>" +
      (it.first_at ? "<span>加入于 " + fmtDay(it.first_at) + "</span>" : "") +
      (it.hits > 1 ? "<span>划过 " + it.hits + " 次</span>" : "") +
      "</div></article>";
  };
  let html = '<h2 class="sechead">📚 需复习<span class="cnt2">' + review.length + " 个</span></h2>";
  html += review.length ? review.map(card).join("") : '<div class="alldone">这一边空了——都掌握啦，或者还没收过生词。</div>';
  if (done.length) {
    html += '<h2 class="sechead">✅ 已掌握<span class="cnt2">' + done.length + " 个</span></h2>" + done.map(card).join("");
  }
  $("vlist").innerHTML = html;
  // 录音（后台生成好才有按钮）：一个播放器轮着用，点别的自动切
  const playUrl = (url) => {
    if (!window._aud) window._aud = new Audio();
    const au = window._aud;
    if (au.dataset.cur === url && !au.paused) { au.pause(); return; }
    au.dataset.cur = url;
    au.src = url;
    au.play().catch(() => {});
  };
  $("vlist").querySelectorAll(".aud[data-h]").forEach((b) => {
    b.onclick = () => playUrl("/api/sent-audio?h=" + encodeURIComponent(b.dataset.h) + "&a=" + b.dataset.a);
  });
  $("vlist").querySelectorAll(".waud").forEach((b) => {
    b.onclick = () => playUrl("/api/word-audio?w=" + encodeURIComponent(b.dataset.w) + "&a=" + b.dataset.a);
  });
  if (own) {
    $("vlist").querySelectorAll(".mst").forEach((b) => {
      b.onclick = async () => {
        b.disabled = true;
        try {
          await api("/api/vocab/master", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ word: b.dataset.w, book: b.dataset.b, mastered: b.dataset.m === "1" }),
          });
          load();
        } catch (e) { b.disabled = false; }
      };
    });
    $("vlist").querySelectorAll(".del").forEach((b) => {
      b.onclick = async () => {
        // 两段式确认：先点变「确认删除？」，再点才真删（不用系统弹框）
        if (!b.classList.contains("armed")) {
          b.classList.add("armed");
          b.textContent = "确认删除？";
          setTimeout(() => { b.classList.remove("armed"); b.textContent = "删除"; }, 4000);
          return;
        }
        b.disabled = true;
        try {
          await api("/api/vocab?word=" + encodeURIComponent(b.dataset.w) +
                    "&book=" + encodeURIComponent(b.dataset.b), { method: "DELETE" });
          load();
        } catch (e) { b.disabled = false; b.classList.remove("armed"); b.textContent = "删除"; }
      };
    });
  }
}

async function doAdd() {
  const inp = $("addInput"), btn = $("addBtn"), msg = $("addMsg");
  const w = inp.value.trim();
  if (!w) { msg.textContent = "先输入一个单词。"; inp.focus(); return; }
  btn.disabled = true; msg.textContent = "添加中…";
  try {
    const j = await api("/api/vocab", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ word: w, book: "manual", src: "manual" }),
    });
    if (j && j.ok) {
      inp.value = "";
      msg.textContent = "已添加。词义和例句后台会自动补上。";
      load();
    } else {
      msg.textContent = "没加上" + ((j && j.error) ? "（" + j.error + "）" : "") + "，请重试。";
    }
  } catch (e) { msg.textContent = "网络出错，请重试。"; }
  btn.disabled = false;
}
$("addBtn").onclick = doAdd;
$("addInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doAdd(); });

init();
</script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); }); }</script>
</body>
</html>
